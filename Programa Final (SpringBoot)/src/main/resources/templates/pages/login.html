<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión - IoT Guardian</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #19395e;
      font-family: 'Raleway', sans-serif;
      padding: 20px;
    }
    .card {
      background: #d0e8c5;
      border-radius: 18px;
      padding: 55px 45px 50px;
      width: 380px;
      box-shadow: 0 20px 100px rgba(255,255,255,0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeUp 0.6s ease both;
      position: relative;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      15%  { transform: translateX(-8px); }
      30%  { transform: translateX(8px); }
      45%  { transform: translateX(-6px); }
      60%  { transform: translateX(6px); }
      75%  { transform: translateX(-3px); }
      90%  { transform: translateX(3px); }
    }
    .card.shake { animation: shake 0.5s ease; }
    h1 {
      color: #1a1a1a;
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 35px;
      line-height: 1.5;
    }
    .field { width: 100%; margin-bottom: 18px; }
    .field label {
      display: block;
      color: #1a1a1a;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .field .input-wrapper { position: relative; width: 100%; }
    .field input {
      width: 100%;
      padding: 13px 45px 13px 16px;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 10px;
      background: rgba(255,255,255,0.35);
      color: #1a1a1a;
      font-size: 0.95rem;
      font-family: 'Raleway', sans-serif;
      outline: none;
      transition: border-color 0.25s, background 0.25s;
    }
    .field input::placeholder { color: rgba(0,0,0,0.4); }
    .field input:focus { border-color: #1a1a1a; background: rgba(255,255,255,0.55); }
    .field input.error { border-color: #e05555; background: rgba(224,85,85,0.08); }
    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(0,0,0,0.4);
      font-size: 1.1rem;
      padding: 0;
      outline: none;
      transition: color 0.25s;
    }
    .toggle-password:hover { color: #1a1a1a; }
    .btn {
      margin-top: 28px;
      width: 100%;
      padding: 14px;
      background: #1d7b55c4;
      color: #1a1a1a;
      font-family: 'Raleway', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      transition: background 0.25s, transform 0.15s, box-shadow 0.25s;
    }
    .btn:hover { background: #bfd4a8; transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,0,0,0.2); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .toast {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: #e05555;
      color: #fff;
      font-family: 'Raleway', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(224,85,85,0.4);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s ease;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .success-overlay {
      position: fixed;
      inset: 0;
      background: #19395e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 100;
      font-family: 'Raleway', sans-serif;
      color: #D8E8C5;
    }
    .success-overlay.show { opacity: 1; pointer-events: all; }
    .success-icon {
      width: 72px; height: 72px;
      background: #D8E8C5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
    .success-overlay p { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; }
    .success-overlay small { font-size: 0.85rem; color: rgba(255,255,255,0.6); }
    .link {
      color: #1a1a1a;
      font-weight: 700;
      text-decoration: none;
      border-bottom: 1.5px solid rgba(0,0,0,0.2);
      transition: border-color 0.2s;
    }
    .link:hover { border-color: #1a1a1a; }
  </style>
</head>
<body>

  <div class="toast" id="toast">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span id="toast-msg">Correo o contraseña incorrectos</span>
  </div>

  <div class="success-overlay" id="successOverlay">
    <div class="success-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <p id="success-nombre">¡Bienvenido!</p>
    <small>Redirigiendo al panel de control...</small>
  </div>

  <div class="card" id="card">
    <h1>Inicio de Sesión<br>a Panel de Control</h1>

    <div class="field">
      <label for="correo">Correo</label>
      <div class="input-wrapper">
        <input type="email" id="correo" placeholder="Ingresa tu correo" autocomplete="email">
      </div>
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <div class="input-wrapper">
        <input type="password" id="password" placeholder="Ingresa tu contraseña" autocomplete="current-password">
        <button type="button" id="toggleBtn" class="toggle-password">
          <i id="eyeIcon" class="fas fa-eye"></i>
        </button>
      </div>
    </div>

    <button class="btn" id="btn-login" onclick="handleLogin()">Iniciar Sesión</button>

    <div style="margin-top:22px;font-size:0.82rem;color:rgba(0,0,0,0.45);text-align:center;">
      ¿No tienes cuenta?
      <a href="/register" class="link">Regístrate</a>
    </div>
  </div>

  <script>
    if (localStorage.getItem('jwt_token')) {
      window.location.href = '/dashboard';
    }

    const passwordInput = document.getElementById('password');
    document.getElementById('toggleBtn').addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      document.getElementById('eyeIcon').classList.toggle('fa-eye');
      document.getElementById('eyeIcon').classList.toggle('fa-eye-slash');
    });

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      if (toastTimer) clearTimeout(toastTimer);
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
    }

    function markError(...inputs) {
      inputs.forEach(el => {
        el.classList.add('error');
        el.addEventListener('input', () => el.classList.remove('error'), { once: true });
      });
      const card = document.getElementById('card');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    }

    async function handleLogin() {
      const correoEl   = document.getElementById('correo');
      const passwordEl = document.getElementById('password');
      const btn        = document.getElementById('btn-login');

      correoEl.classList.remove('error');
      passwordEl.classList.remove('error');

      const correo   = correoEl.value.trim();
      const password = passwordEl.value;

      if (!correo || !password) {
        if (!correo)   correoEl.classList.add('error');
        if (!password) passwordEl.classList.add('error');
        markError(...(!correo && !password ? [correoEl, passwordEl] : !correo ? [correoEl] : [passwordEl]));
        showToast('Completa todos los campos.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Ingresando...';

      try {
        const resp = await fetch('/api/auth/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ correo, password })
        });

        const data = await resp.json();

        if (!resp.ok) {
          markError(correoEl, passwordEl);
          showToast(data.error || 'Correo o contraseña incorrectos');
          return;
        }

        localStorage.setItem('jwt_token',   data.token);
        localStorage.setItem('user_nombre', data.nombre);
        localStorage.setItem('user_correo', data.correo);
        localStorage.setItem('user_role',   data.role);

        document.getElementById('success-nombre').textContent = `¡Bienvenido, ${data.nombre}!`;
        document.getElementById('successOverlay').classList.add('show');
        setTimeout(() => { window.location.href = '/dashboard'; }, 1800);

      } catch (err) {
        showToast('No se pudo conectar con el servidor.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Iniciar Sesión';
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
