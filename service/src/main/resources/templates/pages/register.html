<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - IoT Guardian</title>
  <link rel="shortcut icon" href="./img/icon_netiot.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #19395e;
      font-family: 'Raleway', sans-serif;
      padding: 20px;
    }
    .card {
      background: #d0e8c5;
      border-radius: 18px;
      padding: 50px 45px;
      width: 400px;
      box-shadow: 0 20px 100px rgba(255,255,255,0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeUp 0.6s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      15%  { transform: translateX(-8px); }
      30%  { transform: translateX(8px); }
      45%  { transform: translateX(-6px); }
      60%  { transform: translateX(6px); }
    }
    .card.shake { animation: shake 0.5s ease; }
    h1 {
      color: #1a1a1a;
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    .field { width: 100%; margin-bottom: 16px; }
    .field label {
      display: block;
      color: #1a1a1a;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .field input {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 10px;
      background: rgba(255,255,255,0.35);
      color: #1a1a1a;
      font-size: 0.95rem;
      font-family: 'Raleway', sans-serif;
      outline: none;
      transition: border-color 0.25s, background 0.25s;
    }
    .field input:focus { border-color: #1a1a1a; background: rgba(255,255,255,0.55); }
    .field input.error { border-color: #e05555; background: rgba(224,85,85,0.08); }
    .btn {
      margin-top: 24px;
      width: 100%;
      padding: 14px;
      background: #1d7b55c4;
      color: #1a1a1a;
      font-family: 'Raleway', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      transition: background 0.25s, transform 0.15s;
    }
    .btn:hover { background: #bfd4a8; transform: translateY(-2px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .toast {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      color: #fff;
      font-family: 'Raleway', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 12px;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s ease;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.error { background: #e05555; box-shadow: 0 8px 30px rgba(224,85,85,0.4); }
    .toast.success { background: #4e7c3a; box-shadow: 0 8px 30px rgba(78,124,58,0.4); }
    .link { color: #1a1a1a; font-weight: 700; text-decoration: none; border-bottom: 1.5px solid rgba(0,0,0,0.2); transition: border-color 0.2s; }
    .link:hover { border-color: #1a1a1a; }
  </style>
</head>
<body>

  <div class="toast" id="toast"><span id="toast-msg"></span></div>

  <div class="card" id="card">
    <h1>Crear Cuenta<br>IoT Guardian</h1>

    <div class="field">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" placeholder="Tu nombre completo" autocomplete="name">
    </div>

    <div class="field">
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" placeholder="tu@correo.com" autocomplete="email">
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
    </div>

    <button class="btn" id="btn-register" onclick="handleRegister()">Crear cuenta</button>

    <div style="margin-top:22px;font-size:0.82rem;color:rgba(0,0,0,0.45);text-align:center;">
      ¿Ya tienes cuenta?
      <a href="/login" class="link">Inicia sesión</a>
    </div>
  </div>

  <script>
    if (localStorage.getItem('jwt_token')) {
      window.location.href = '/dashboard';
    }

    let toastTimer = null;
    function showToast(msg, type = 'error') {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      toast.className = `toast ${type} show`;
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
    }

    async function handleRegister() {
      const nombreEl   = document.getElementById('nombre');
      const correoEl   = document.getElementById('correo');
      const passwordEl = document.getElementById('password');
      const btn        = document.getElementById('btn-register');

      [nombreEl, correoEl, passwordEl].forEach(el => el.classList.remove('error'));

      const nombre   = nombreEl.value.trim();
      const correo   = correoEl.value.trim();
      const password = passwordEl.value;

      if (!nombre || !correo || !password) {
        if (!nombre)   nombreEl.classList.add('error');
        if (!correo)   correoEl.classList.add('error');
        if (!password) passwordEl.classList.add('error');
        showToast('Completa todos los campos.');
        const card = document.getElementById('card');
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
        return;
      }

      if (password.length < 6) {
        passwordEl.classList.add('error');
        showToast('La contraseña debe tener al menos 6 caracteres.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creando cuenta...';

      try {
        const resp = await fetch('/api/auth/register', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ correo, password, nombre })
        });

        const data = await resp.json();

        if (!resp.ok) {
          showToast(data.error || 'No se pudo crear la cuenta.', 'error');
          return;
        }

        showToast('Cuenta creada exitosamente. Redirigiendo...', 'success');
        setTimeout(() => { window.location.href = '/login'; }, 1800);

      } catch (err) {
        showToast('No se pudo conectar con el servidor.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Crear cuenta';
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleRegister();
    });
  </script>
</body>
</html>
